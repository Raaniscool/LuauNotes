<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LuauNotes — Roblox / Luau Knowledge</title>
  <meta name="description" content="A complete Roblox/Luau knowledge encyclopedia, reference system, and personal learning companion." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='15' y='15' width='70' height='70' rx='16' fill='%234d9fff'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%23fff'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">💻</span>
        <span class="brand-text">
          <strong>ROBLOX / LUAU</strong>
          <em>KNOWLEDGE</em>
        </span>
        <button id="sidebar-close" class="icon-btn sidebar-close" title="Collapse sidebar (Alt+[)">«</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">
          <span class="theme-icon-dark">🌙</span><span class="theme-icon-light">☀️</span>
          <span class="theme-label">Dark mode</span>
        </button>
        <div class="sidebar-version" id="sidebar-version"></div>
      </div>
    </aside>
    <div id="sidebar-scrim" class="sidebar-scrim"></div>

    <!-- Main column -->
    <div class="main-col">
      <header class="topbar">
        <button id="sidebar-open" class="icon-btn" title="Open sidebar (Alt+[)">☰</button>
        <div class="search-wrap" id="search-wrap">
          <span class="search-icon">🔎</span>
          <input id="global-search" type="text" placeholder="Search anything — APIs, concepts, patterns, notes…" autocomplete="off" spellcheck="false" />
          <kbd class="search-kbd">/</kbd>
          <div id="search-dropdown" class="search-dropdown hidden"></div>
        </div>
        <button id="palette-btn" class="palette-btn" title="Command palette (Ctrl+K)">⌘K</button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Command palette -->
  <div id="palette-overlay" class="palette-overlay hidden">
    <div class="palette">
      <input id="palette-input" type="text" placeholder="Jump to a topic, note, or action…" autocomplete="off" spellcheck="false" />
      <div id="palette-results" class="palette-results"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toasts" class="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
